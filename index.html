<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMRS Quest</title>
    <script>
      // Tema terang/gelap berlaku untuk SELURUH aplikasi (src/platform/theme.ts). Penandanya dipasang di sini, sebelum
      // gambar pertama, supaya latar tidak berkedip saat halaman dibuka — termasuk saat '#/sql' dibuka langsung:
      // - data-theme di <html> untuk semua rute (layar jalur: palet src/theme.css; Beranda & landing: token q-*);
      // - data-q-landing HANYA untuk rute Beranda dan halaman katalog/landing jalur ('#/landing…'). LandingRoot
      //   melepasnya saat halaman landing ditinggalkan; data-theme tetap.
      // Aturan rutenya SAMA dengan parseRoute (src/platform/router.ts): layar jalur = segmen pertama hash yang tidak
      // kosong ('#//sql' = '#/sql'), ter-decode, huruf kecil, bukan 'landing' dan bukan segmen cadangan
      // (RESERVED_SEGMENTS). scripts/verify/theme.ts menjalankan skrip ini untuk banyak hash dan membandingkannya.
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          theme = localStorage.getItem('simrs-quest:theme:v1');
        } catch (error) {
          /* penyimpanan diblokir: ikut tema sistem */
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.setAttribute('data-theme', theme);
        var hash = location.hash;
        var first = null;
        if (hash.indexOf('#/') === 0) {
          var parts = hash.slice(2).split('/');
          for (var i = 0; i < parts.length && first === null; i++) if (parts[i] !== '') first = parts[i];
        }
        if (first !== null) {
          try {
            first = decodeURIComponent(first).toLowerCase();
          } catch (error) {
            first = null; // segmen rusak → Beranda
          }
        }
        if (first !== null && ['landing', 'profil', 'cari', 'pengaturan', 'runner'].indexOf(first) < 0) return;
        root.setAttribute('data-q-landing', '');
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
